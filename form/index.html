<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <div class="container">
      <div class="info">
        <div class="navbar">
          <i class="fa-solid fa-user-plus"></i>
          <p>Employee Information Form</p>
        </div>
        <hr class="line"style="width: 1240px;margin-left: 20px;margin-top: 5px;background-color: rgb(81, 59, 208);border: solid 1.5px blue;"/>
        <div style="display: flex; flex-direction: row">
          <div class="id">
            <label for=""><i class="fa-solid fa-hashtag"></i> ID</label>
            <input type="text" img="" placeholder="Enter ID" />
          </div>
          <div class="name">
            <label for=""><i class="fa-solid fa-user"></i> Name</label>
            <input type="text" img="" placeholder="Enter Name" />
          </div>
        </div>
        <div style="display: flex; flex-direction: row">
          <div class="gender">
            <label for=""
              ><i class="fa-solid fa-mars-and-venus"></i> Gender</label
            >
            <select name="gender" id="gender">
              <option value="">Select Gender</option>
              <option value="male">Male</option>
              <option value="female">Female</option>
              <option value="other">Other</option>
            </select>
          </div>
          <div class="departmen">
            <label for=""
              ><i class="fa-solid fa-building"></i> Department</label
            >
            <input type="text" img="" placeholder="Enter Department" />
          </div>
        </div>
        <div style="display: flex; flex-direction: row">
          <div class="salary">
            <label for=""><i class="fa-solid fa-dollar-sign"></i> Salary($)</label>
            <input type="text" img="" placeholder="0.00" />
          </div>
          <div class="hour">
            <label for=""><i class="fa-solid fa-clock"></i> Hours</label>
            <input type="text" img="" placeholder="0.00" />
          </div>
          <div class="rate">
            <label for=""><i class="fa-solid fa-clock-rotate-left"></i> Rate($/hr)</label>
            <input type="text" img="" placeholder="0.00" />
          </div>
        </div>
        <div style="display: flex; flex-direction: row; padding-left: 20px;">
            <div class="add">
               <input type="submit" value="Add Employee" >
          </div>
        </div>
      </div>

      <div class="data">
          <div class="fomation">
               <i class="fa-regular fa-calendar-days"></i>
               <p>Employee Data Table</p>
          </div>
          <hr class="line"style="width: 1240px;margin-left: 20px;margin-top: 5px;background-color: rgb(81, 59, 208);border: solid 1.5px blue;"/>
        <div class="item">
             <label for=""><i class="fa-solid fa-hashtag"></i> ID</label>
             <label style="padding-left: 6%;" for=""><i class="fa-solid fa-user"></i> Name</label>
             <label style="padding-left: 6%;" for=""><i class="fa-solid fa-mars-and-venus"></i> Gender</label>
             <label style="padding-left: 6%;" for=""><i class="fa-solid fa-building"></i> Department</label>
             <label style="padding-left: 6%;" for=""><i class="fa-solid fa-money-bill"></i> Salary</label>
             <label style="padding-left: 6%;" for=""><i class="fa-solid fa-clock"></i> Hours</label>
             <label style="padding-left: 6%;" for=""><i class="fa-solid fa-clock-rotate-left"></i> Rate</label>
             <label style="padding-left: 6%;" for=""><i class="fa-solid fa-calculator"></i> Total</label>
             <label style="padding-left: 6%;" for=""><i class="fa-solid fa-gear"></i> Action</label>
        </div>
        <div class="nodata">
             <i class="fa-solid fa-inbox"></i>
             <p>No employee data yet. Add your first employee using the from above.</p>
        </div>
          <hr class="line"style="width: 1240px;margin-left: 20px;margin-top: 2%;background-color: rgb(152, 152, 152);border: solid 1.5px rgb(205,205,205);"/>
      </div>
    </div>
  </body>
</html>
